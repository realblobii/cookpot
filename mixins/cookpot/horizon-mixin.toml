[mod]
id = "cookpot"
version = "0.2.0"
priority = 100

[compatibility]
horizon_revision = "c9d474dd9116e84c243f8992d75c11314df56f06"

# Cookpot's pure logic (definitions, progress), compiled into the game beside the hooks.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game/native_hooks.rs"
name = "cookpot"
source = "runtime.rs"

# A block named by a `cookpot:machine` file gets a block entity.
[[injection]]
id = "entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "entity.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "ticks.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "container.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "screen"
hook = "screen"
hook_version = 1
kind = "HEAD"
helper = "screen.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<NativeScreen>", value = "&mut *screen" },
]

[[injection]]
id = "draw"
hook = "screen_draw"
hook_version = 1
kind = "HEAD"
helper = "draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
]
